name: release

# On a version tag (v0.2.0, ...), build the bundle for every supported
# architecture and publish both as GitHub Release assets. The VM then pulls the
# one matching its architecture with `./sdsc.sh update`.
#
# The tag is the deploy trigger and the version record: bump pubspec.yaml +
# CHANGELOG and push a v* tag when a build is cut.
#
# Doc-only changes (markdown, license, changelog) never cut a release — the
# release must contain a code change to be worth tagging.

on:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'LICENSE'
      - 'LICENSE.*'
      - 'docs/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Generate build identity from pubspec
        run: dart run tool/generate_build_version.dart

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test -j 4

      - name: Build bundle (AOT + native assets)
        run: dart build cli -o build

      - name: Include local deployment script
        run: cp deploy.sh build/bundle/deploy.sh

      - name: Package bundle + checksum
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          tar czf "sdsc-bot-${TAG}-${{ matrix.arch }}.tar.gz" -C build/bundle .
          sha256sum "sdsc-bot-${TAG}-${{ matrix.arch }}.tar.gz" > "sdsc-bot-${TAG}-${{ matrix.arch }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.arch }}
          path: |
            sdsc-bot-*.tar.gz
            sdsc-bot-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/sdsc-bot-*.tar.gz
            artifacts/sdsc-bot-*.tar.gz.sha256
          generate_release_notes: false
