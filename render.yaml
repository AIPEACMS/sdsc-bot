# Render blueprint (free tier): Docker service with a persistent disk.
# Alternative: Railway — just point it at this repo, it uses the Dockerfile.
services:
  - type: web
    name: sdsc-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: GROUP_A_CONTACT
        value: TBD
      - key: GROUP_B_CONTACT
        value: TBD @tbd
      - key: SDSC_DB
        value: /data/sdsc.db
    disk:
      name: sdsc-data
      mountPath: /data
      sizeGB: 1
